[build-system]
# 77 minimum : c'est la version qui accepte une expression SPDX en chaîne pour
# project.license, la table { text = … } étant dépréciée (retrait en 02/2027).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jewelbox-music-ripper"
# Version lue depuis src/jewelbox_ripper/__init__.py : une seule source de
# vérité, que release.sh est seul à modifier.
dynamic = ["version"]
description = "Extraction de CD audio vers une bibliothèque JewelBox Music"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

dependencies = [
    "mutagen>=1.45",         # écriture des tags
    "discid>=1.2",           # Disc ID depuis le TOC (nécessite libdiscid)
    "musicbrainzngs>=0.7",   # identification du disque
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4"]

[project.scripts]
jewelbox-rip = "jewelbox_ripper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "jewelbox_ripper.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["src/jewelbox_ripper"]
# Le code frontière — CLI interactive, pilotage de cdparanoia/flac, lecture du
# TOC, écriture mutagen — s'exerce avec un vrai lecteur et un vrai serveur, pas
# en CI headless. Toute la logique restante doit être couverte à 95 % minimum.
omit = [
    "src/jewelbox_ripper/__main__.py",
    "src/jewelbox_ripper/cli.py",
]

[tool.coverage.report]
fail_under = 95
show_missing = true
precision = 1
# Les branches de repli sur import manquant ne s'exercent qu'avec la
# dépendance absente, ce que la CI installe justement.
exclude_also = [
    "raise MissingToolError",
    "except ImportError:",
]
